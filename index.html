<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Pokédex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Mini Pokédex</h1>

<!-- Menu de recherche, filtrage, et tri -->
<div class="search-menu">
  <!-- Champ de recherche -->
  <input type="text" id="search-bar" placeholder="Rechercher un Pokémon par nom...">
  <!-- Liste déroulante pour filtrer par type -->
  <select id="type-filter">
    <option value="">Tous les types</option>
    <option value="Électrique">Électrique</option>
    <option value="Plante">Plante</option>
    <option value="Poison">Poison</option>
    <option value="Feu">Feu</option>
    <option value="Eau">Eau</option>
    <option value="Normal">Normal</option>
    <option value="Fée">Fée</option>
    <option value="Spectre">Spectre</option>
    <option value="Combat">Combat</option>
    <option value="Vol">Vol</option>
    <option value="Glace">Glace</option>
    <option value="Roche">Roche</option>
    <option value="Sol">Sol</option>
    <option value="Psy">Psy</option>
  </select>
  <!-- Liste déroulante pour trier les Pokémons -->
  <select id="sort-order">
    <option value="name-asc">Nom (A-Z)</option>
    <option value="name-desc">Nom (Z-A)</option>
    <option value="level-asc">Niveau (croissant)</option>
    <option value="level-desc">Niveau (décroissant)</option>
  </select>
</div>

<!-- Conteneur pour les cartes Pokémon -->
<div class="pokemon-container">
  <!-- Les cartes Pokémon apparaîtront ici -->
  <p>Pikachu<small>Électrique</small></p>
  <p>Bulbizarre<small>Plante</small><small>Poison</small></p>
  <p>Salamèche<small>Feu</small></p>
  <p>Carapuce<small>Eau</small></p>
  <p>Roudoudou<small>Normal</small><small>Fée</small></p>
  <p>Ectoplasma<small>Spectre</small><small>poison</small></p>
  <p>Evoli<small>normal</small><small>combat</small></p>
  <p>Dracaufeu<small>feu</small><small>Vol</small></p>
  <p>Florizarre<small>Plante</small></p>
  <p>Tortank<small>Eau</small></p>
  <p>Mélofée<small>Fée</small></p>
  <p>Raichu<small>Électrique</small></p>
  <p>Magicarpe<small>Eau</small></p>
  <p>Lokhlass<small>Eau</small></p>
  <p>Onix<small>Roche</small></p>
  <p>Ronflex<small>Normal</small></p>
  <p>Mewtwo<small>Psy</small></p>
</div>

<script src="script.js"></script>
</body>
</html>
